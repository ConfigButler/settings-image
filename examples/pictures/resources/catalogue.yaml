# Pictures are plain files under raw/: they go into the image byte for byte, with no base64 and
# no ConfigMap size limit. The settings refer to them by their path in the image, and the
# application reads raw/products/vanilla.png from the mounted image.
apiVersion: shop.configbutler.ai/v1
kind: Product
metadata:
  name: vanilla
spec:
  title: Vanilla
  picture: raw/products/vanilla.png
---
apiVersion: shop.configbutler.ai/v1
kind: Product
metadata:
  name: chocolate
spec:
  title: Chocolate
  picture: raw/products/chocolate.png
---
apiVersion: shop.configbutler.ai/v1
kind: Product
metadata:
  name: strawberry
spec:
  title: Strawberry
  picture: raw/products/strawberry.png
---
apiVersion: shop.configbutler.ai/v1
kind: UserProfile
metadata:
  name: ada
spec:
  displayName: Ada
  avatar: raw/users/ada.svg
